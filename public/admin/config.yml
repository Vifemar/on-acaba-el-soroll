backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

locale: "ca"

publish_mode: editorial_workflow

collections:
  - name: "pagines"
    label: "Pàgines"

    files:

      - name: "aquest-lloc"
        label: "Aquest lloc"
        file: "src/content/pagines/aquest-lloc.md"

        fields:

          - label: "Títol"
            name: "title"
            widget: "string"

          - label: "Etiqueta"
            name: "label"
            widget: "string"

          - label: "Text"
            name: "body"
            widget: "markdown"


      - name: "sobre-mi"
        label: "Sobre mi"
        file: "src/content/pagines/sobre-mi.md"

        fields:

          - label: "Títol"
            name: "title"
            widget: "string"

          - label: "Etiqueta"
            name: "label"
            widget: "string"

          - label: "Text"
            name: "body"
            widget: "markdown"

  - name: "entrades"
    label: "Entrades"
    label_singular: "Entrada"

    folder: "src/content/entrades"
    create: true

    extension: "md"
    format: "frontmatter"

    slug: "{{slug}}"

    summary: "{{title}} · {{category}} · {{date}}"

    editor:
      preview: true

    fields:

      - label: "Títol"
        name: "title"
        widget: "string"
        hint: "El títol principal de l'entrada."

      - label: "Data de publicació"
        name: "date"
        widget: "datetime"
        date_format: "DD/MM/YYYY"
        time_format: false
        format: "YYYY-MM-DD"
        default: "{{now}}"

      - label: "Categoria"
        name: "category"
        widget: "select"
        options:
          - "Dins"
          - "Vincles"
          - "Absències"
          - "El món"
          - "Pensament"
          - "Fragments"

      - label: "Etiquetes"
        name: "tags"
        widget: "list"
        required: false
        hint: "Paraules que relacionen aquesta entrada amb altres textos."

      - label: "Descripció"
        name: "description"
        widget: "text"
        hint: "Una frase breu per a portada, SEO i previsualitzacions."

      - label: "Imatge principal"
        name: "image"
        widget: "image"
        required: false
        choose_url: false
        hint: "Opcional. Imatge relacionada amb l'entrada."

      - label: "Frase per a Story"
        name: "story_text"
        widget: "text"
        required: false
        hint: "Una frase breu que vulgues destacar quan compartisques l'entrada."

      - label: "Text"
        name: "body"
        widget: "markdown"
        modes:
          - "rich_text"
          - "raw"